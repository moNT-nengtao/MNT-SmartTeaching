# ==================== 生产环境配置 ====================

spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://prod-db-host:3306/smart_teaching?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: prod_user
    password: prod_strong_password
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 600000
      connection-timeout: 30000
      pool-name: SmartTeachingHikariPool

  # Redis 配置
  data:
    redis:
      host: prod-redis-host
      port: 6379
      password: prod_redis_password
      timeout: 10000ms
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 200MB
      file-size-threshold: 2MB
      location: /tmp/uploads

# 服务器配置
server:
  port: 8080

# 文件上传路径
file:
  upload-path: /var/data/smart-teaching/uploads

# 生产环境日志级别
logging:
  level:
    root: WARN
    com.smartteaching: INFO
    com.smartteaching.**.mapper: INFO
  file:
    name: /var/log/smart-teaching/smart-teaching.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      total-size-cap: 1GB
      max-history: 30
      file-name-pattern: /var/log/smart-teaching/smart-teaching.%d{yyyy-MM-dd}.%i.log

# MyBatis-Plus 生产环境配置（使用 Slf4j）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 生产环境使用更长的密钥（从环境变量读取更安全）
jwt:
  secret: ${JWT_SECRET:prod-secret-key-at-least-32-chars-long}
  expiration: 604800000  # 7 天