# ============================================================
#  本地开发环境配置
#  使用方式：spring.profiles.active=dev
# ============================================================

spring:
  # ---------- 数据源【本地MySQL】 ----------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/smart_teaching?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      pool-name: SmartTeachingHikariPool

  # ---------- Redis【本地】没有Redis就注释掉这一块 ----------
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
      timeout: 10000ms
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 200MB
      file-size-threshold: 2MB

server:
  port: 8080

# ---------- JWT 和生产保持一致即可 ----------
jwt:
  secret: abcdefghijklmnopqrstuvwxyz1234567890
  expiration: 604800000
  header: Authorization
  token-prefix: "Bearer "

# 本地上传路径（Windows/Mac自动适配，写相对路径）
file:
  upload-path: ./uploads

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.smartteaching: DEBUG
    com.smartteaching.**.mapper: DEBUG
    org.springframework.security: DEBUG
